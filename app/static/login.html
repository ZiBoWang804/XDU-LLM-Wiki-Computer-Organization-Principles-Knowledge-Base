<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 编译原理考点地图</title>
<style>
:root { --accent:#7c5cff; --ta:#1677ff; --ink:#23262f; --muted:#8a90a3; --line:#e7e9f0; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font-family: "Segoe UI","Microsoft YaHei",sans-serif; color: var(--ink);
  background: linear-gradient(135deg, #eef0ff 0%, #f6f7fb 45%, #e8f4ff 100%);
}
.card {
  width: 400px; background: #fff; border-radius: 20px; padding: 38px 34px;
  box-shadow: 0 18px 60px rgba(60,60,120,.14);
}
.logo {
  width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center;
  background: linear-gradient(135deg,#7c5cff,#1677ff); color:#fff; font-size: 26px; margin-bottom: 16px;
}
h1 { margin: 0; font-size: 21px; }
.sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 22px; }
.sub b { color: var(--ta); }
label { display: block; font-size: 12.5px; color: var(--muted); margin: 13px 0 5px; }
input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 11px;
  font-size: 14px; outline: none;
}
input:focus { border-color: var(--accent); }
.btn {
  width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 12px;
  background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.alt { background: none; color: var(--accent); border: 1.5px solid var(--accent); margin-top: 10px; }
.err { color: #e03131; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
.demo {
  margin-top: 20px; padding: 12px 14px; background: #f6f7fb; border-radius: 11px;
  font-size: 12px; color: var(--muted); line-height: 1.9;
}
.demo b { color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">⬣</div>
  <h1>编译原理考点地图</h1>
  <p class="sub">课程复习"考点地图"智能体 · 基于 <b>TeleAgent 智能体平台</b> · 请登录</p>

  <label>用户名</label>
  <input id="username" placeholder="用户名" onkeydown="if(event.key==='Enter')doLogin()">
  <label>密码</label>
  <input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="err"></div>

  <button class="btn" onclick="doLogin()">登 录</button>
  <button class="btn alt" onclick="doRegister()">注册学生账号</button>

  <div class="demo">
    演示账号：<br>
    <b>教师端</b>　teacher / teacher123<br>
    <b>学生端</b>　student / student123
  </div>
</div>

<script>
async function req(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || '请求失败');
  return data;
}

function enterApp(s) {
  localStorage.setItem('ta_token', s.token);
  localStorage.setItem('ta_role', s.role);
  localStorage.setItem('ta_name', s.display_name);
  location.href = s.role === 'teacher' ? '/static/teacher.html' : '/static/index.html';
}

async function doLogin() {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const s = await req('/api/auth/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });
    enterApp(s);
  } catch (e) { err.textContent = e.message; }
}

async function doRegister() {
  const err = document.getElementById('err');
  err.textContent = '';
  const u = document.getElementById('username').value.trim();
  if (!u) { err.textContent = '请先填写用户名'; return; }
  try {
    const s = await req('/api/auth/register', {
      username: u,
      password: document.getElementById('password').value || '123456',
      display_name: u,
    });
    enterApp(s);
  } catch (e) { err.textContent = e.message; }
}
</script>
</body>
</html>
